# Production/offline compose file: references pre-built, pre-loaded images
# only -- no "build:" sections. Images are loaded via scripts/load_images.sh
# from docker-images/*.tar, never rebuilt on the offline server (per the
# "Build Once, Validate Once, Deploy Anywhere" principle).

# Explicit project name -- without this, Compose defaults the project name to
# the basename of the directory containing this file ("compose"), which any
# other release package that also keeps its compose file in a folder named
# "compose" would collide with, silently merging both stacks into one Compose
# project. This is Compose's own supported fix for that ambiguity, and stays
# consistent with the container_name/network name convention below.
name: ${PROJECT_NAME:-pfms}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${PROJECT_NAME:-pfms}-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ../backups:/var/opt/mssql/backup
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: rah-pfms-db-init:${APP_VERSION:-1.0.0}
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_SERVER: sqlserver
      DB_DATABASE: ${DB_DATABASE:-IncidentManager}
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      USE_WINDOWS_AUTH: "false"
      TRUST_SERVER_CERTIFICATE: "true"
    volumes:
      # provisioning.v1.json + checksum + manifest ship physically in this
      # release bundle (../database/sqlserver/seed/) -- never baked into the
      # image. Missing/invalid -> provision.py fails loudly, this container
      # exits non-zero, backend never starts.
      - ../database/sqlserver/seed:/app/database/sqlserver/seed:ro
    restart: "no"

  backend:
    image: rah-pfms-backend:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-pfms}-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_DATABASE: ${DB_DATABASE:-IncidentManager}
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      USE_WINDOWS_AUTH: "false"
      TRUST_SERVER_CERTIFICATE: "true"
      # Extracted from assets/whisper-model-medium.zip by install_offline.sh
      # before this container starts (see scripts/export_whisper_model.sh on
      # the engineering side). Faster_Wisper.py's get_whisper_model() loads
      # directly from this path -- no huggingface.co access needed at
      # runtime. HF_HUB_OFFLINE is defense-in-depth: any accidental
      # name-based fallback fails fast locally instead of hanging trying to
      # reach the internet.
      WHISPER_MODEL_PATH: /models/whisper-medium
      HF_HUB_OFFLINE: "1"
      # Fernet key for encrypting stored integration secrets (currently: the
      # Hospital Directory API key), see core/settings_encryption.py. Never
      # stored in the database itself -- only here, in the environment.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    ports:
      - "${BACKEND_HOST_PORT:-8100}:8100"
    volumes:
      - backend_config:/app/backend/config
      - ../assets/whisper-model-medium:/models/whisper-medium:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/status"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    image: rah-pfms-frontend:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-pfms}-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8101}:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  backend_config:

networks:
  default:
    name: ${PROJECT_NAME:-pfms}-net
