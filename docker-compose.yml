# Base stack definition. NOT meant to be run alone for routine local dev --
# docker-compose.dev.yml layers bind-mounts/reload/HTTPS on top of this and
# is the one used day to day; see its own header comment for that invocation.
#
# This file is for the rare one-off "prod-like local" test only: `cp
# .env.example .env`, fill in real values, then:
#   docker compose --env-file .env -f docker-compose.yml -p pfms up -d
# Don't leave that stack running permanently -- tear it down
# (`docker compose -p pfms down`) once you're done with it, so it can't
# drift out of sync with .env.dev's stack the way it did before.
#
# Explicit project name -- without this, Compose defaults the project name to
# the basename of the directory containing this file, so two sessions that
# each omit `-p` (or use a different one) can silently collide on the same
# containers/network. Same fix already used in
# release/1.2.0/compose/docker-compose.yml.
name: ${PROJECT_NAME:-pfms}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${PROJECT_NAME:-pfms}-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqlserver_data:/var/opt/mssql
      # Bind mount (not a named volume) so .bak files land in a plain host
      # directory operators can browse/copy off-box, per the org's backup
      # standard ("stored outside the container").
      - ./backups:/var/opt/mssql/backup
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: database/sqlserver/Dockerfile
    image: rah-pfms-db-init:${APP_VERSION:-1.0.0}
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_SERVER: sqlserver
      DB_DATABASE: ${DATABASE_NAME}
      DB_USERNAME: ${DATABASE_USER}
      # A real, distinct credential from the sa account below -- the
      # dedicated login's own independently-generated password, never
      # aliased to MSSQL_SA_PASSWORD (that would only ever be correct
      # while DB_USERNAME was literally "sa" -- see HCopilot's own
      # Bug 30 for the same real gap shape).
      DB_PASSWORD: ${DATABASE_PASSWORD}
      # ensure_login_exists.py reads these two under their own literal
      # names (not DB_USERNAME/DB_PASSWORD above) -- a separate script
      # with its own env-var convention, not a typo to collapse into one.
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # Needed only by install_database.py's ensure_database_exists()/
      # ensure_login_exists() steps, which must connect as sa (the only
      # login that can CREATE DATABASE/CREATE LOGIN) for their own
      # one-time bootstrap, before the rest of this container's steps
      # switch to the dedicated login above.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      USE_WINDOWS_AUTH: "false"
      TRUST_SERVER_CERTIFICATE: "true"
    volumes:
      # provisioning.v1.json + checksum + manifest live here at runtime, never
      # baked into the image (see .dockerignore). Missing/invalid -> provision.py
      # fails loudly and this container exits non-zero, so backend (which
      # depends on db-init completing successfully) never starts either.
      - ./database/sqlserver/seed:/app/database/sqlserver/seed:ro
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rah-pfms-backend:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-pfms}-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_HOST_PORT:-8100}:8100"
    environment:
      DB_SERVER: sqlserver
      DB_DATABASE: ${DATABASE_NAME}
      DB_USERNAME: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      USE_WINDOWS_AUTH: "false"
      TRUST_SERVER_CERTIFICATE: "true"
      # Baked into the backend image at build time (see backend/Dockerfile) --
      # Faster_Wisper.py's get_whisper_model() loads directly from this path
      # when set, so no huggingface.co access is needed at runtime.
      # HF_HUB_OFFLINE is defense-in-depth: if anything ever falls back to
      # name-based lookup, it fails fast locally instead of hanging trying
      # to reach the internet.
      WHISPER_MODEL_PATH: /models/whisper-medium
      HF_HUB_OFFLINE: "1"
      # Fernet key for encrypting stored integration secrets (currently: the
      # Hospital Directory API key), see core/settings_encryption.py. Never
      # stored in the database itself -- only here, in the environment.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      # Separate Fernet key for the "export user credentials" admin feature
      # (dbo.APP_UserPasswordExport), see core/password_export_encryption.py.
      # Deliberately a different key than SETTINGS_ENCRYPTION_KEY above.
      PASSWORD_EXPORT_ENCRYPTION_KEY: ${PASSWORD_EXPORT_ENCRYPTION_KEY}
    volumes:
      # Once this named volume exists, it SHADOWS the backend/config/ copy
      # baked into the image -- edits to db_settings.json in git no longer
      # reach a running deployment past its first start. To fix a live
      # deployment's DB/settings: use the /config page (works even in
      # bootstrap mode, when the backend can't reach the database at all),
      # which writes into this same volume -- do NOT expect a new image load
      # to update these settings. To force a fresh copy from the image
      # instead, remove the volume (`docker volume rm <project>_backend_config`)
      # before the next `up` (this deletes any settings saved via /config).
      - backend_config:/app/backend/config
    # The Hospital Directory API's real server ("malin") is only resolvable
    # by hostname on the hospital's internal DNS -- this container's own
    # /etc/hosts (managed by Docker, not editable in-place at runtime) has no
    # entry for it otherwise. Confirmed via live testing: the host machine
    # could resolve/reach malin once its own /etc/hosts had this entry, but
    # this container -- a separate network namespace -- still could not,
    # until this was added here. See database/sqlserver/... or
    # backend/core/hospital_directory_client.py for the consumer of this.
    extra_hosts:
      - "malin:150.50.1.34"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/status"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ../Front_End_Feedback_Analysis
      dockerfile: Dockerfile
    image: rah-pfms-frontend:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-pfms}-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8101}:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  backend_config:

networks:
  default:
    name: ${PROJECT_NAME:-pfms}-net
