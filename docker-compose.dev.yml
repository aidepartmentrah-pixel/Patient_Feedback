# Dev override — merge on top of docker-compose.yml to get live code editing
# without a full image rebuild on every change:
#
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml -p pfms-dev up -d --build
#
# After the first build, code edits under ./backend just need:
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml -p pfms-dev restart backend
# (uvicorn --reload below also auto-picks up most changes without even that).

services:
  backend:
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
